<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสร้างใบแนวทาง หงส์ทองนำโชค (เวอร์ชันล็อกพิกเซลสมบูรณ์แบบ)</title>
    <style>
        /* --- สไตล์ส่วนกลางควบคุมหน้าจอ --- */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1402, #3d2b08);
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }

        h1, h2 {
            text-align: center;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        /* --- สไตล์หน้าแรก (โฟลเดอร์) --- */
        .folder-btn {
            background: linear-gradient(135deg, #ffd700, #b38600);
            color: #332200;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .sub-list {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed #ffd700;
        }

        .lotto-item-btn {
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }
        .lotto-item-btn:hover {
            background: #ffd700;
            color: #000;
            font-weight: bold;
        }

        /* --- [จุดแก้ไขตายตัว] บังคับสเกลการ์ดและตัวเลขเป็นระบบพิกเซลจำลอง (สเกลไม่เพี้ยน) --- */
        #generator-page {
            display: none;
            width: 100%;
        }

        /* กล่องควบคุมอัตราส่วนรูปภาพ 2:3 (กว้าง 400 สูง 600 เสมอ) */
        .lotto-card-wrapper {
            width: 100%;
            position: relative;
            aspect-ratio: 400 / 600;
            margin-bottom: 15px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .lotto-card {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_ca0723.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* สั่งให้ฟอนต์ทุกตัวย่อขยายตามสัดส่วนความกว้างของการ์ดเว็บแบบเป๊ะๆ ด้วยหน่วย % และ cqi */
        .lotto-card-wrapper {
            container-type: inline-size;
        }

        .lotto-card div {
            position: absolute;
            font-weight: bold;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8);
            color: #7a0000;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ชื่อหวย (ซ้ายมือ - อยู่ที่เดิมขนาดใหญ่เด่นชัด) */
        .dynamic-title {
            top: 40%;
            left: 28%;
            transform: translate(-50%, -50%);
            font-size: 7.5cqw; /* ปรับขนาดอิงตามความกว้างของการ์ดจริง */
            color: #6a0d0d !important;
            width: 44%;
            height: 20%;
            line-height: 1.2;
            word-break: break-word;
        }

        /* ตัวเลขวิ่ง/รูด (ช่องขวาบน) */
        .box-run {
            top: 51.5%;
            left: 71.5%;
            transform: translate(-50%, -50%);
            font-size: 11cqw; 
            font-weight: 900 !important;
            letter-spacing: 5px;
            text-indent: 5px;
            width: 40%;
            height: 10%;
        }

        /* เลข 2 ตัว (3 ช่องล่าง) - ล็อกพิกัดลงทีละบล็อกกึ่งกลางกรอบเล็ก */
        .two-digit {
            top: 67.8%;
            font-size: 7cqw;
            width: 11%;
            height: 7%;
        }
        #two-1 { left: 51.5%; transform: translate(-50%, -50%); }
        #two-2 { left: 71.5%; transform: translate(-50%, -50%); }
        #two-3 { left: 91.5%; transform: translate(-50%, -50%); }

        /* เลข 3 ตัว (2 ช่องล่างสุด) - ล็อกพิกัดลงทีละบล็อกกึ่งกลางกรอบเล็ก */
        .three-digit {
            top: 84.7%;
            font-size: 7.2cqw;
            width: 20%;
            height: 7%;
            letter-spacing: 1px;
        }
        #three-1 { left: 59.5%; transform: translate(-50%, -50%); }
        #three-2 { left: 83.5%; transform: translate(-50%, -50%); }

        /* --- ปุ่มควบคุมส่วนล่าง --- */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row-nav {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-spin {
            background: linear-gradient(to bottom, #ff3333, #990000);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.3);
            font-size: 18px;
            padding: 12px;
            width: 100%;
        }
        .btn-spin:hover { filter: brightness(1.2); }

        .btn-nav {
            flex: 1;
            background: linear-gradient(135deg, #ffd700, #b38600);
            color: #332200;
            font-size: 14px;
        }

        .btn-back {
            background: #444;
            color: white;
            width: 100%;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="folder-page">
            <h1>🔮 ระบบเลือกใบแนวทาง 🔮</h1>
            
            <button class="folder-btn" onclick="toggleFolder('mon-fri')">📁 จันทร์ - ศุกร์</button>
            <div id="mon-fri" class="sub-list"></div>

            <button class="folder-btn" onclick="toggleFolder('sat-sun')">📁 เสาร์ - อาทิตย์</button>
            <div id="sat-sun" class="sub-list"></div>
        </div>

        <div id="generator-page">
            <h2 id="current-lotto-title">แนวทาง</h2>
            
            <div class="lotto-card-wrapper">
                <div class="lotto-card">
                    <div class="dynamic-title" id="card-lotto-name">ชื่อหวย</div>
                    <div class="box-run" id="view-run">?-?</div>
                    
                    <div class="two-digit" id="two-1">??</div>
                    <div class="two-digit" id="two-2">??</div>
                    <div class="two-digit" id="two-3">??</div>
                    
                    <div class="three-digit" id="three-1">???</div>
                    <div class="three-digit" id="three-2">???</div>
                </div>
            </div>

            <div class="control-panel">
                <button class="btn-action btn-spin" onclick="spinNumbers()">⚡ สุ่มเลขเด็ด ⚡</button>
                
                <div class="row-nav">
                    <button class="btn-action btn-nav" onclick="navigateLotto(-1)">◀️ หวยก่อนหน้า</button>
                    <button class="btn-action btn-nav" onclick="navigateLotto(1)">หวยถัดไป ▶️</button>
                </div>
                
                <button class="btn-action btn-back" onclick="goBack()">🏠 กลับหน้าเลือกโฟลเดอร์</button>
            </div>
        </div>

    </div>

    <script>
        const monFriList = ["ลาว Extra", "นิเคอิเช้า VIP", "นอยอาเซียน", "นิเคอิเช้า", "จีนเช้า VIP", "จีนเช้า", "ลาว TV", "ฮั่งเส็งเช้า VIP", "ฮั่งเส็งเช้า", "ฮานอย HD", "ไต้หวัน VIP", "ฮานอย STAR", "ไต้หวัน", "เกาหลี", "เกาหลี VIP", "นิเคอิบ่าย", "นิเคอิบ่าย VIP", "ลาว HD", "จีนบ่าย", "ฮานอย TV", "จีนบ่าย VIP", "ฮั่งเส็งบ่าย", "ฮั่งเส็งบ่าย VIP", "ลาวสตาร์", "สิงคโปร์", "ไทยเย็น", "ฮานอยกาชาด", "อินเดีย", "สิงคโปร์ VIP", "อียิปต์", "ฮานอยสามัคคี", "ฮานอยพิเศษ", "ฮานอยปกติ", "ฮานอย VIP", "ฮานอยพัฒนา", "ลาวพัฒนา", "ลาวสามัคคี", "ลาวอาเซียน", "ลาว VIP", "ลาวสามัคคี VIP", "อังกฤษ VIP", "ลาวสตาร์ VIP", "ฮานอย Extra", "อังกฤษ", "เยอรมัน", "รัสเซีย", "เยอรมัน VIP", "ลาวกาชาด", "รัสเซีย VIP", "ดาวโจนส์ VIP", "ดาวโจนส์ STAR", "ดาวโจนส์"];
        const satSunList = ["ลาว Extra", "นิเคอิเช้า VIP", "นอยอาเซียน", "จีนเช้า VIP", "ลาว TV", "ฮั่งเส็งเช้า VIP", "ฮานอย HD", "ไต้หวัน VIP", "ฮานอย STAR", "เกาหลี VIP", "นิเคอิบ่าย VIP", "ลาว HD", "ฮานอย TV", "จีนบ่าย VIP", "ฮั่งเส็งบ่าย VIP", "ลาวสตาร์", "ฮานอยกาชาด", "สิงคโปร์ VIP", "ฮานอยพิเศษ", "ฮานอยสามัคคี", "ฮานอยปกติ", "ฮานอย VIP", "ฮานอยพัฒนา", "ลาวสามัคคี", "ลาวอาเซียน", "ลาว VIP", "ลาวสามัคคี VIP", "อังกฤษ VIP", "ลาวสตาร์ VIP", "ฮานอย Extra", "เยอรมัน VIP", "ลาวกาชาด", "รัสเซีย VIP", "ดาวโจนส์ VIP", "ดาวโจนส์ STAR"];
        
        let currentFolder = []; 
        let currentIndex = 0;

        function renderLottoButtons() {
            const monFriContainer = document.getElementById('mon-fri');
            monFriContainer.innerHTML = monFriList.map((item, idx) => 
                `<button class="lotto-item-btn" onclick="openGenerator('mon-fri', ${idx})">${item}</button>`
            ).join('');

            const satSunContainer = document.getElementById('sat-sun');
            satSunContainer.innerHTML = satSunList.map((item, idx) => 
                `<button class="lotto-item-btn" onclick="openGenerator('sat-sun', ${idx})">${item}</button>`
            ).join('');
        }
        renderLottoButtons();

        function toggleFolder(folderId) {
            const folder = document.getElementById(folderId);
            folder.style.display = folder.style.display === "grid" ? "none" : "grid";
        }

        function openGenerator(folderType, index) {
            currentFolder = folderType === 'mon-fri' ? monFriList : satSunList;
            currentIndex = index;
            document.getElementById('folder-page').style.display = 'none';
            document.getElementById('generator-page').style.display = 'block';
            updateCardDisplay();
        }

        function updateCardDisplay() {
            let lottoName = currentFolder[currentIndex];
            document.getElementById('current-lotto-title').innerText = "ใบแนวทาง " + lottoName;
            document.getElementById('card-lotto-name').innerText = lottoName;
            
            document.getElementById('view-run').innerText = "?-?";
            document.getElementById('two-1').innerText = "??";
            document.getElementById('two-2').innerText = "??";
            document.getElementById('two-3').innerText = "??";
            document.getElementById('three-1').innerText = "???";
            document.getElementById('three-2').innerText = "???";
        }

        function navigateLotto(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = currentFolder.length - 1;
            } else if (currentIndex >= currentFolder.length) {
                currentIndex = 0;
            }
            updateCardDisplay();
        }

        function goBack() {
            document.getElementById('folder-page').style.display = 'block';
            document.getElementById('generator-page').style.display = 'none';
        }

        function spinNumbers() {
            let run1 = Math.floor(Math.random() * 10);
            let run2 = Math.floor(Math.random() * 10);
            while(run1 === run2) { run2 = Math.floor(Math.random() * 10); }
            document.getElementById('view-run').innerText = `${run1}-${run2}`;

            let t1 = Math.floor(Math.random() * 100).toString().padStart(2, '0');
            let t2 = Math.floor(Math.random() * 100).toString().padStart(2, '0');
            let t3 = Math.floor(Math.random() * 100).toString().padStart(2, '0');
            document.getElementById('two-1').innerText = t1;
            document.getElementById('two-2').innerText = t2;
            document.getElementById('two-3').innerText = t3;

            let h1 = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            let h2 = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            document.getElementById('three-1').innerText = h1;
            document.getElementById('three-2').innerText = h2;
        }
    </script>
</body>
</html>
