<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสร้างใบแนวทาง หงส์ทองนำโชค (เวอร์ชันบันทึกรูปภาพได้)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* --- สไตล์ส่วนกลางควบคุมหน้าจอ --- */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1402, #3d2b08);
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }

        h1, h2 {
            text-align: center;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        /* --- สไตล์หน้าแรก (โฟลเดอร์) --- */
        .folder-btn {
            background: linear-gradient(135deg, #ffd700, #b38600);
            color: #332200;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .sub-list {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed #ffd700;
        }

        .lotto-item-btn {
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lotto-item-btn:hover {
            background: #ffd700;
            color: #000;
            font-weight: bold;
        }

        /* --- โครงสร้างล็อกตำแหน่งตามรูปจริง --- */
        #generator-page {
            display: none;
            width: 100%;
        }

        .lotto-card-wrapper {
            width: 100%;
            position: relative;
            aspect-ratio: 682 / 1024; 
            margin-bottom: 15px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            container-type: inline-size;
        }

        .lotto-card {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_ca0723.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        .lotto-card div {
            position: absolute;
            font-weight: bold;
            color: #4a0202; 
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ชื่อหวยชิดขอบบนของพื้นที่ว่างฝั่งซ้าย */
        .dynamic-title {
            top: 36%;
            left: 27.5%;
            transform: translate(-50%, -50%);
            font-size: 7.5cqw; 
            width: 48%;
            height: 12%;
            align-items: flex-start !important; 
            line-height: 1.1;
            word-break: break-word;
        }

        /* วิ่ง / รูด - กล่องขวาบน */
        .box-run {
            top: 51%;
            left: 71.3%;
            transform: translate(-50%, -50%);
            font-size: 11cqw; 
            font-weight: 900 !important;
            width: 50%;
            height: 10%;
            letter-spacing: 2px;
        }

        /* เลข 2 ตัว - ลงตรงกลางกล่องสี่เหลี่ยมแนวตั้ง 3 กล่องพอดีเป๊ะ */
        .two-digit {
            top: 67.8%;
            font-size: 7.5cqw;
            width: 15%;
            height: 8%;
        }
        #two-1 { left: 57.5%; transform: translate(-50%, -50%); }
        #two-2 { left: 71.5%; transform: translate(-50%, -50%); }
        #two-3 { left: 85.5%; transform: translate(-50%, -50%); }

        /* เลข 3 ตัว - ลงตรงกลางกล่องสี่เหลี่ยมแนวนอน 2 กล่องล่างสุดพอดีเป๊ะ */
        .three-digit {
            top: 84.7%;
            font-size: 7.5cqw;
            width: 23%;
            height: 8%;
            letter-spacing: 1px;
        }
        #three-1 { left: 61%; transform: translate(-50%, -50%); }
        #three-2 { left: 82%; transform: translate(-50%, -50%); }

        /* --- ปุ่มควบคุมส่วนล่าง --- */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row-nav {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-spin {
            background: linear-gradient(to bottom, #ff3333, #990000);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.3);
            font-size: 18px;
            padding: 12px;
            width: 100%;
        }
        .btn-spin:hover { filter: brightness(1.2); }

        /* [เพิ่มใหม่] สไตล์ปุ่มบันทึกรูปภาพโทนสีเขียวเด่นสะดุดตา */
        .btn-save {
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            color: white;
            font-size: 16px;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
            width: 100%;
        }
        .btn-save:hover { filter: brightness(1.1); }

        .btn-nav {
            flex: 1;
            background: linear-gradient(135deg, #ffd700, #b38600);
            color: #332200;
            font-size: 14px;
        }

        .btn-back {
            background: #444;
            color: white;
            width: 100%;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="folder-page">
            <h1>🔮 ระบบเลือกใบแนวทาง 🔮</h1>
            
            <button class="folder-btn" onclick="toggleFolder('mon-fri')">📁 จันทร์ - ศุกร์</button>
            <div id="mon-fri" class="sub-list"></div>

            <button class="folder-btn" onclick="toggleFolder('sat-sun')">📁 เสาร์ - อาทิตย์</button>
            <div id="sat-sun" class="sub-list"></div>
        </div>

        <div id="generator-page">
            <h2 id="current-lotto-title">แนวทาง</h2>
            
            <div class="lotto-card-wrapper" id="capture-area">
                <div class="lotto-card">
                    <div class="dynamic-title" id="card-lotto-name">ชื่อหวย</div>
                    <div class="box-run" id="view-run">?-?</div>
                    
                    <div class="two-digit" id="two-1">??</div>
                    <div class="two-digit" id="two-2">??</div>
                    <div class="two-digit" id="two-3">??</div>
                    
                    <div class="three-digit" id="three-1">???</div>
                    <div class="three-digit" id="three-2">???</div>
                </div>
            </div>

            <div class="control-panel">
                <button class="btn-action btn-spin" onclick="spinNumbers()">⚡ สุ่มเลขเด็ด ⚡</button>
                
                <button class="btn-action btn-save" onclick="saveAsImage()">💾 บันทึกรูปภาพแนวทาง</button>
                
                <div class="row-nav">
                    <button class="btn-action btn-nav" onclick="navigateLotto(-1)">◀️ หวยก่อนหน้า</button>
                    <button class="btn-action btn-nav" onclick="navigateLotto(1)">หวยถัดไป ▶️</button>
                </div>
                
                <button class="btn-action btn-back" onclick="goBack()">🏠 กลับหน้าเลือกโฟลเดอร์</button>
            </div>
        </div>

    </div>

    <script>
        const monFriList = ["🇱🇦 ลาว Extra", "🇯🇵 นิเคอิเช้า VIP", "🇻🇳 นอยอาเซียน", "🇯🇵 นิเคอิเช้า", "🇨🇳 จีนเช้า VIP", "🇨🇳 จีนเช้า", "🇱🇦 ลาว TV", "🇭🇰 ฮั่งเส็งเช้า VIP", "🇭🇰 ฮั่งเส็งเช้า", "🇻🇳 ฮานอย HD", "🇹🇼 ไต้หวัน VIP", "🇻🇳 ฮานอย STAR", "🇹🇼 ไต้หวัน", "🇰🇷 เกาหลี", "🇰🇷 เกาหลี VIP", "🇯🇵 นิเคอิบ่าย", "🇯🇵 นิเคอิบ่าย VIP", "🇱🇦 ลาว HD", "🇨🇳 จีนบ่าย", "🇻🇳 ฮานอย TV", "🇨🇳 จีนบ่าย VIP", "🇭🇰 ฮั่งเส็งบ่าย", "🇭🇰 ฮั่งเส็งบ่าย VIP", "🇱🇦 ลาวสตาร์", "🇸🇬 สิงคโปร์", "🇹🇭 ไทยเย็น", "🇻🇳 ฮานอยกาชาด", "🇮🇳 อินเดีย", "🇸🇬 สิงคโปร์ VIP", "🇪🇬 อียิปต์", "🇻🇳 ฮานอยสามัคคี", "🇻🇳 ฮานอยพิเศษ", "🇻🇳 ฮานอยปกติ", "🇻🇳 ฮานอย VIP", "🇻🇳 ฮานอยพัฒนา", "🇱🇦 ลาวพัฒนา", "🇱🇦 ลาวสามัคคี", "🇱🇦 ลาวอาเซียน", "🇱🇦 ลาว VIP", "🇱🇦 ลาวสามัคคี VIP", "🇬🇧 อังกฤษ VIP", "🇱🇦 ลาวสตาร์ VIP", "🇻🇳 ฮานอย Extra", "🇬🇧 อังกฤษ", "🇩🇪 เยอรมัน", "🇷🇺 รัสเซีย", "🇩🇪 เยอรมัน VIP", "🇱🇦 ลาวกาชาด", "🇷🇺 รัสเซีย VIP", "🇺🇸 ดาวโจนส์ VIP", "🇺🇸 ดาวโจนส์ STAR", "🇺🇸 ดาวโจนส์"];
        const satSunList = ["🇱🇦 ลาว Extra", "🇯🇵 นิเคอิเช้า VIP", "🇻🇳 นอยอาเซียน", "🇨🇳 จีนเช้า VIP", "🇱🇦 ลาว TV", "🇭🇰 ฮั่งเส็งเช้า VIP", "🇻🇳 ฮานอย HD", "🇹🇼 ไต้หวัน VIP", "🇻🇳 ฮานอย STAR", "🇰🇷 เกาหลี VIP", "🇯🇵 นิเคอิบ่าย VIP", "🇱🇦 ลาว HD", "🇻🇳 ฮานอย TV", "🇨🇳 จีนบ่าย VIP", "🇭🇰 ฮั่งเส็งบ่าย VIP", "🇱🇦 ลาวสตาร์", "🇻🇳 ฮานอยกาชาด", "🇸🇬 สิงคโปร์ VIP", "🇻🇳 ฮานอยพิเศษ", "🇻🇳 ฮานอยสามัคคี", "🇻🇳 ฮานอยปกติ", "🇻🇳 ฮานอย VIP", "🇻🇳 ฮานอยพัฒนา", "🇱🇦 ลาวสามัคคี", "🇱🇦 ลาวอาเซียน", "🇱🇦 ลาว VIP", "🇱🇦 ลาวสามัคคี VIP", "🇬🇧 อังกฤษ VIP", "🇱🇦 ลาวสตาร์ VIP", "🇻🇳 ฮานอย Extra", "🇩🇪 เยอรมัน VIP", "🇱🇦 ลาวกาชาด", "🇷🇺 รัสเซีย VIP", "🇺🇸 ดาวโจนส์ VIP", "🇺🇸 ดาวโจนส์ STAR"];
        
        let currentFolder = []; 
        let currentIndex = 0;

        function renderLottoButtons() {
            const monFriContainer = document.getElementById('mon-fri');
            monFriContainer.innerHTML = monFriList.map((item, idx) => 
                `<button class="lotto-item-btn" onclick="openGenerator('mon-fri', ${idx})" title="${item}">${item}</button>`
            ).join('');

            const satSunContainer = document.getElementById('sat-sun');
            satSunContainer.innerHTML = satSunList.map((item, idx) => 
                `<button class="lotto-item-btn" onclick="openGenerator('sat-sun', ${idx})" title="${item}">${item}</button>`
            ).join('');
        }
        renderLottoButtons();

        function toggleFolder(folderId) {
            const folder = document.getElementById(folderId);
            folder.style.display = folder.style.display === "grid" ? "none" : "grid";
        }

        function openGenerator(folderType, index) {
            currentFolder = folderType === 'mon-fri' ? monFriList : satSunList;
            currentIndex = index;
            document.getElementById('folder-page').style.display = 'none';
            document.getElementById('generator-page').style.display = 'block';
            updateCardDisplay();
        }

        function updateCardDisplay() {
            let lottoNameWithFlag = currentFolder[currentIndex];
            let lottoNameClean = lottoNameWithFlag.replace(/^[\uD83C][\uDDE6-\uDDFF][\uD83C][\uDDE6-\uDDFF]\s*/, "");

            document.getElementById('current-lotto-title').innerText = "ใบแนวทาง " + lottoNameClean;
            document.getElementById('card-lotto-name').innerText = lottoNameClean;
            
            document.getElementById('view-run').innerText = "?-?";
            document.getElementById('two-1').innerText = "??";
            document.getElementById('two-2').innerText = "??";
            document.getElementById('two-3').innerText = "??";
            document.getElementById('three-1').innerText = "???";
            document.getElementById('three-2').innerText = "???";
        }

        function navigateLotto(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = currentFolder.length - 1;
            } else if (currentIndex >= currentFolder.length) {
                currentIndex = 0;
            }
            updateCardDisplay();
        }

        function goBack() {
            document.getElementById('folder-page').style.display = 'block';
            document.getElementById('generator-page').style.display = 'none';
        }

        function generateTwoDigitWithRun(runNumbers) {
            let core = runNumbers[Math.floor(Math.random() * runNumbers.length)];
            let another = Math.floor(Math.random() * 10);
            return Math.random() < 0.5 ? `${core}${another}` : `${another}${core}`;
        }

        function spinNumbers() {
            let run1 = Math.floor(Math.random() * 10);
            let run2 = Math.floor(Math.random() * 10);
            while(run1 === run2) { run2 = Math.floor(Math.random() * 10); }
            document.getElementById('view-run').innerText = `${run1}-${run2}`;

            let runArray = [run1, run2];

            let t1 = generateTwoDigitWithRun(runArray);
            let t2 = generateTwoDigitWithRun(runArray);
            let t3 = generateTwoDigitWithRun(runArray);
            
            while(t2 === t1) { t2 = generateTwoDigitWithRun(runArray); }
            while(t3 === t1 || t3 === t2) { t3 = generateTwoDigitWithRun(runArray); }

            document.getElementById('two-1').innerText = t1;
            document.getElementById('two-2').innerText = t2;
            document.getElementById('two-3').innerText = t3;

            let h1 = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            let h2 = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            while(h2 === h1) { h2 = Math.floor(Math.random() * 1000).toString().padStart(3, '0'); }
            
            document.getElementById('three-1').innerText = h1;
            document.getElementById('three-2').innerText = h2;
        }

        /* [เพิ่มใหม่] ฟังก์ชันแปลงรหัส HTML ของตัวการ์ดใบแนวทางเซฟออกมาเป็นรูปภาพโดยเฉพาะ */
        function saveAsImage() {
            const targetElement = document.getElementById('capture-area');
            const lottoName = document.getElementById('card-lotto-name').innerText;
            
            // เรียกคำสั่งบันทึกภาพพร้อมเปิดฟังก์ชันต้านภาพแตก (scale: 2) เพื่อความคมชัดสูง
            html2canvas(targetElement, {
                scale: 2, 
                useCORS: true,
                allowTaint: true
            }).then(canvas => {
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = `แนวทาง_${lottoName}.png`; // ตั้งชื่อไฟล์ตามชื่อหวยที่เลือกอยู่ขณะนั้น
                link.href = image;
                link.click();
            }).catch(err => {
                alert("เกิดข้อผิดพลาดในการบันทึกรูปภาพ กรุณาลองใหม่อีกครั้ง");
                console.error(err);
            });
        }
    </script>
</body>
</html>
